field_categories:
  - category: source_control
    fields:
      - name: source_surface
        description: "Paper, fixed Git commit, fixed Hugging Face revision, mutable official page, local audit, video transcript, or independent methodology source."
        required: true
      - name: version_and_access_date
        description: "Exact revision and access date; mutable surfaces must not be silently merged with frozen snapshots."
        required: true
      - name: unit_and_count
        description: "Count together with its unit: workflow, runnable instance, task-card row, selected path, folder, submission, release state, run, or repeated trial."
        required: true
      - name: evidence_role
        description: "Source fact, author claim, researcher inference, project recommendation, or open decision."
        required: true
      - name: claim_locator
        description: "Page, table, code path, dataset row, file line, or video timestamp."
        required: true
  - category: decision_contract
    fields:
      - name: decision_requested
        description: "The exact approval or choice the report asks the interviewer or project owner to make."
        required: true
      - name: deliverable_unit
        description: "Accepted runnable instance target and separately reported distinct workflow count W."
        required: true
      - name: intended_use
        description: "Development, customer validation, private final evaluation, training, OTS sale, or managed evaluation service."
        required: true
      - name: alternatives_considered
        description: "Full build, pilot-first, narrower-domain build, acquire/partner, or no action."
        required: true
      - name: non_goals
        description: "Claims or product modes excluded from the initial deliverable."
        required: true
  - category: validity_chain
    fields:
      - name: customer_decision
        description: "The deployment, training, procurement, or research decision the measurement informs."
        required: true
      - name: target_capability
        description: "Professional capability to be measured."
        required: true
      - name: workflow_and_instance
        description: "Stable workflow identity and concrete runnable instance identity."
        required: true
      - name: observable_outcome
        description: "Artifact, system state, behavior, or other observable evidence of success."
        required: true
      - name: evaluator_and_metric
        description: "Executable scoring path, aggregation rule, uncertainty, and claim boundary."
        required: true
  - category: asset_contract
    fields:
      - name: task_spec_and_inputs
        description: "Instruction, input files, starting state, and required output."
        required: true
      - name: environment_manifest
        description: "OS image, software, versions, permissions, network policy, credentials, and reset procedure."
        required: true
      - name: hidden_reference_and_evaluator
        description: "Reference custody, scorer version, tests, failure handling, and adversarial hardening."
        required: true
      - name: qa_and_provenance
        description: "Author, reviewers, rights, licenses, sensitivity, change log, acceptance state, and sign-off."
        required: true
      - name: run_artifacts
        description: "Configuration manifest, trajectory, logs, outputs, evaluator result, retries, and exceptions."
        required: true
  - category: portfolio_and_operations
    fields:
      - name: admission_gates
        description: "Runnable, legally usable, minimally verifiable, safe, identity-resolved, and within scope."
        required: true
      - name: selection_objectives
        description: "Coverage, client relevance, economic value, frontier discrimination, evaluator feasibility, diversity, future training value, and cost."
        required: true
      - name: variant_and_overlap_rules
        description: "Legitimate instance variation, pseudo-variant rejection, internal deduplication, and external benchmark overlap."
        required: true
      - name: stage_gates_and_roles
        description: "Production stages, role separation, independent review, acceptance, quarantine, repair, retirement, and owner sign-off."
        required: true
  - category: evaluation_integrity
    fields:
      - name: evaluator_tests
        description: "Gold, known-bad, alternate-correct, near-miss, mutation, metamorphic, shortcut, and gaming tests."
        required: true
      - name: failure_taxonomy
        description: "Agent failure versus prompt, input, environment, reference, evaluator, policy, or infrastructure defect."
        required: true
      - name: statistical_protocol
        description: "Repeated trials, seeds, uncertainty intervals, minimum detectable difference, ranking stability, and missing-run handling."
        required: true
      - name: human_baseline
        description: "Matched expert population, affordances, quality, time, cost, agreement, and arbitration."
        required: true
      - name: integrity_threat_model
        description: "Contamination, search-time leakage, reference leakage, grader gaming, evaluator tampering, shortcut behavior, and controls."
        required: true
  - category: scale_and_lifecycle
    fields:
      - name: pilot_parameters
        description: "Acceptance yield, expert hours, engineering hours, evaluator disagreement, environment failures, variant multiplicity, run variance, and refresh burden."
        required: true
      - name: cost_formula
        description: "Labor, environment, evaluator, QC, infrastructure, licensing, run, adjudication, and refresh costs as pilot-derived variables."
        required: true
      - name: stage_gate_and_kill_criterion
        description: "Advance, repair, rescope, pause, or stop conditions."
        required: true
      - name: lifecycle_and_refresh
        description: "Proposed, authored, validated, accepted, active-private, active-public, quarantined, repaired, retired, or replaced; include refresh triggers and score comparability."
        required: true
  - category: uncertainty
    fields:
      - name: settled
        description: "Conclusions supported strongly enough to anchor the report."
        required: true
      - name: provisional
        description: "Project recommendations that still require pilot or owner approval."
        required: true
      - name: underdetermined
        description: "Questions public evidence cannot answer."
        required: true
