topic: "UniPat interview assignment: ALE-style 1000-asset benchmark production report"
decision_question: "How should a team define, select, produce, validate, release, and maintain 1,000 ALE-style benchmark assets without turning the deliverable into 1,000 prompts or an easily benchmaxxed leaderboard?"
time_range: "Primary evidence frozen through 2026-08-09; ALE paper pinned to arXiv:2606.05405v2"
hypotheses:
  - id: H1
    statement: "The contract should target 1,000 final-QC accepted runnable instances and separately disclose the number of distinct workflows."
  - id: H2
    statement: "ALE mitigates several benchmaxxing mechanisms but does not eliminate evaluator gaming, configuration confounding, contamination, or benchmark depreciation."
  - id: H3
    statement: "A stratified pilot must determine workflow multiplicity, acceptance yield, expert effort, evaluator reliability, run variance, cost, and schedule before scale-up."
  - id: H4
    statement: "The final deliverable should be a written internal decision report with technical appendices, not a slide deck or a concatenation of research questions 1-5."
items:
  - id: scope_and_product
    name: "Scope and product definition"
    category: "local research report 01"
    description: "Define deliverable unit, product modes, release pools, asset contract, non-goals, cost variables, and client questions."
  - id: ale_blueprint
    name: "ALE blueprint and version audit"
    category: "local research report 02"
    description: "Pin the system under test, workflow-instance distinction, metrics, source/version ledger, and claims ALE can and cannot support."
  - id: public_corpus
    name: "Public corpus and evaluator audit"
    category: "local research report 03"
    description: "Audit fixed public task surfaces, executable evaluator paths, evaluator archetypes, gaming risks, and public evidence gaps."
  - id: adjacent_landscape
    name: "Adjacent benchmark landscape"
    category: "local research report 04"
    description: "Compare ALE with adjacent agent benchmarks and isolate ALE's combination-level contribution, recurring trade-offs, and transferable production patterns."
  - id: portfolio_sampling
    name: "Portfolio and sampling strategy"
    category: "local research report 05"
    description: "Define admission gates, sampling frame, multi-objective selection, workflow identity, valid variants, deduplication, and pilot-frozen allocation."
  - id: hook_audit
    name: "Benchmaxxing talk hook audit"
    category: "video transcript and official conference metadata"
    description: "Verify provenance, exact timestamps, caption limitations, commercial-interest boundary, and the narrow rhetorical role of the opening hook."
  - id: implementation_gap
    name: "Production implementation gaps"
    category: "next-stage research"
    description: "Fill expert operations, production SOP, evaluator validation, infrastructure, governance, repeated-run statistics, human baseline, and pilot capacity planning."
execution:
  output_dir: "C:/Users/theod/OneDrive/文档/Prework/ale_final_report_architecture"
  evidence_labels:
    - "source_fact"
    - "author_claim"
    - "researcher_inference"
    - "project_recommendation"
    - "open_decision"
  main_report_rule: "Organize by decision logic, not by research-question number."
  numerical_rule: "Do not convert public counts or illustrative figures into staffing, cost, schedule, pass-rate, split, or allocation commitments."
