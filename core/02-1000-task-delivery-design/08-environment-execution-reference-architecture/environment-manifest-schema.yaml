schema_name: ale_environment_manifest
schema_version: "1.0.0-draft"
purpose: >-
  Versioned contract for one runnable instance environment family and for the
  concrete resolved environment used by one agent run. Secret values and hidden
  reference contents are forbidden from every manifest view.

manifest_views:
  public:
    description: "Agent/team-visible specification without hidden identities, secret bindings or reference hashes."
    allowed_sections:
      - identity
      - platform
      - display_and_locale
      - software_public
      - filesystem_contract
      - network_profile_public
      - visible_inputs
      - lifecycle_public
      - agent_contract
  operator:
    description: "Control-plane manifest; may contain opaque secret/reference binding IDs, never values or decryptable material."
    allowed_sections: "all sections"
  run_attestation:
    description: "Append-only record of actual resolved digests, runtime observations, policy decisions and artifact hashes."
    generated_at: "post-provision and post-run; immutable after signature"

required_top_level:
  - identity
  - platform
  - software
  - filesystem
  - network
  - data_bindings
  - lifecycle
  - agent_and_harness
  - evaluator
  - observability_and_retention
  - supply_chain
  - acceptance
  - run_attestation

identity:
  manifest_id: "stable URI or UUID"
  manifest_revision: "immutable revision ID"
  workflow_id: "stable workflow identity"
  instance_id: "stable runnable-instance identity"
  environment_family_id: "shared image/profile family"
  release_pool: "development | validation | private_final | rotation | retired"
  owner_ids:
    task_owner: "opaque organization identity"
    environment_owner: "opaque organization identity"
    evaluator_owner: "opaque organization identity"
  created_at: "RFC 3339 timestamp"
  supersedes: "prior manifest revision or null"
  change_reason: "human-readable change record"
  evidence_freeze:
    ale_paper: "arXiv revision"
    ale_code: "Git commit"
    ale_hugging_face: "dataset revision"

platform:
  substrate: "full_vm | shared_kernel_container | hypervisor_isolated_container | microvm | nested_vm | existing_sandbox | remote_desktop | dedicated_host"
  effective_boundary:
    kernel_owner: "shared_host | per_instance_guest | provider_opaque"
    privilege_mode: "rootless | rootful | privileged | administrator"
    device_passthrough: "none | mediated | direct"
    host_mounts: ["declared host mount, mode and purpose"]
    management_plane_access: "declared endpoints and principals"
  provider_binding:
    provider_id: "logical provider; not a credential"
    region: "region or on-prem site"
    zone_or_host_class: "availability zone or hardware pool class"
    tenant_or_project_ref: "opaque control-plane binding"
    placement_constraints: ["dedicated/shared, CPU/GPU family, affinity, confidential-compute requirements"]
  image:
    logical_name: "human-readable image family"
    immutable_id: "provider image ID and/or OCI digest"
    digest_algorithm: "sha256 or organization-approved algorithm"
    digest: "content digest"
    parent_image_digests: ["ordered immutable parent IDs"]
    build_provenance_ref: "signed attestation URI + digest"
    sbom_refs: ["build/analyzed/deployed/runtime SBOM URI + digest"]
    signature_refs: ["signature or verification summary URI"]
    release_channel: "candidate | accepted | deprecated | quarantined | revoked"
    rollback_predecessor: "previous accepted immutable image ID"
  os:
    family: "Windows | Linux | other"
    edition: "exact edition"
    version: "exact version/build"
    architecture: "amd64 | arm64 | other"
    kernel_or_build_id: "kernel release or Windows build/UBR"
    patch_level: "patch snapshot/date and installed update IDs"
    boot_mode: "UEFI/BIOS and secure-boot state where relevant"
  compute:
    vcpu_count: "integer"
    cpu_model_or_class: "resolved model/class"
    memory_bytes: "integer"
    storage:
      root_bytes: "integer"
      scratch_bytes: "integer"
      type_and_performance_class: "provider/storage class"
      encryption_mode: "provider-managed | customer-managed | other"
    accelerators:
      - type: "GPU/TPU/other"
        model: "exact model"
        count: "integer"
        vgpu_profile: "profile or null"
        driver_version: "exact version"
        runtime_version: "CUDA/DirectX/other exact version"
        firmware_or_vbios: "version where observable"
        device_mode: "passthrough | mediated | shared | none"
        capability_claims:
          compute: "required | forbidden | not_applicable"
          application_render: "required | forbidden | not_applicable"
          frame_encode: "required | forbidden | not_applicable"
  virtualization:
    hypervisor_or_runtime: "name and exact version"
    nested_virtualization: "enabled | disabled"
    isolation_features: ["user namespaces", "secure boot", "vTPM", "IOMMU", "other"]

display_and_locale:
  display_server_or_protocol: "RDP | VNC | Xvfb | Wayland | X11 | console | other"
  resolution: {width_px: "integer", height_px: "integer"}
  color_depth_bits: "integer"
  dpi_or_scale_percent: "number"
  color_profile_id: "profile hash or null"
  desktop_session: "desktop/window manager and version"
  keyboard_layout: "BCP 47/language-layout identifier"
  locale: "BCP 47 or OS locale identifier"
  timezone: "IANA timezone"
  clock_source_and_freeze_policy: "NTP/fixed/test clock policy"
  installed_fonts:
    manifest_ref: "font inventory URI + digest"
    required_font_hashes: ["font file hashes"]
  remote_session:
    provider_and_protocol_version: "RDP/DCV/PCoIP/VNC client and server versions or null"
    codec_and_chroma: "codec, color/chroma mode or null"
    monitor_count: "integer"
    dynamic_resolution: "enabled | disabled | not_applicable"
    redirected_devices: ["clipboard, drive, printer, audio, USB and other redirection state"]

software:
  installed_components:
    - component_id: "stable package/application/plugin identity"
      name: "human-readable name"
      version: "exact version/build"
      architecture: "architecture"
      installer_or_package_hash: "digest"
      install_recipe_ref: "IaC/package recipe revision"
      install_location: "path"
      plugins_and_extensions:
        - {name: "plugin name", version: "exact version", hash: "digest"}
      configuration_hashes: ["policy/config file digests"]
      dependency_lock_ref: "lockfile URI + digest or null"
      update_policy: "disabled/frozen | controlled | task-managed"
      license_binding_ref: "opaque binding ID; no entitlement/token/value"
      license_model: "named_user | device | floating | node_locked | subscription | open_source | other"
      activation_scope: "image | boot | run | user_session | external_server"
      license_terms_evidence_ref: "task-owner approved terms/evidence reference"
  launch_contracts:
    - component_id: "component identity"
      launch_command_or_protocol_ref: "versioned launcher"
      health_probe: "observable launch/readiness check"
      expected_version_probe: "command/API/UI evidence"

filesystem:
  base_snapshot_digest: "start-state filesystem or disk snapshot digest"
  partition_and_mount_manifest_ref: "URI + digest"
  path_contract:
    input: {path: "path", mode: "read_only"}
    software: {path: "path", mode: "read_only_or_execute"}
    output: {path: "path", mode: "agent_writable"}
    scratch: {path: "path", mode: "ephemeral_agent_writable"}
    reference: {path: "judge-plane path only", agent_mount: "forbidden"}
  required_state_hashes: ["registry/config/profile/template hashes"]
  forbidden_residue_patterns: ["secret/reference/prior-run/cache identifiers"]
  user_and_permission_manifest_ref: "accounts/groups/ACL URI + digest"
  writable_path_allowlist: ["paths"]
  persistence_policy: "none | task_declared_state_only"
  attached_volumes:
    - {volume_id: "opaque immutable/snapshot ID", purpose: "root/profile/scratch/output", reset_semantics: "recreate/restore/wipe/retain", mount_mode: "ro/rw"}

network:
  profile_id: "offline | simulated | allowlist | controlled_open"
  policy_revision: "immutable policy ID"
  dns_policy: "resolver, logging and block rules"
  egress_proxy_ref: "logical proxy/policy binding"
  allowed_destinations: ["domain/service identifiers; no credentials"]
  denied_destinations: ["private networks, metadata services, control/judge plane"]
  allowed_protocols_and_methods: ["protocol/method rules"]
  inbound_policy: "deny by default; explicit control-plane channels"
  download_policy: "size/type/quarantine/scan rules; values set by approved profile"
  upload_and_dlp_policy: "destination/method/data-class rules"
  search_contamination_controls: ["solution-domain blocks", "query logging", "snapshot search", "canaries"]
  traffic_capture:
    metadata_only: "boolean"
    content_capture: "off | redacted | encrypted_restricted"
    retention_policy_ref: "policy ID"
  simulated_or_mirrored_services:
    - {service_id: "logical service", fixture_or_snapshot_digest: "immutable digest", reset_revision: "version", synthetic_account_set_ref: "opaque ID"}

data_bindings:
  visible_inputs:
    - {logical_name: "name", uri: "staging URI", size_bytes: "integer", hash_algorithm: "sha256", hash: "digest", media_type: "type", license_ref: "rights record"}
  hidden_references:
    - reference_binding_id: "opaque judge-plane binding"
      encrypted_store_uri: "operator/judge visible only"
      ciphertext_hash: "digest"
      plaintext_hash: "judge-plane/control record only"
      custody_owner: "identity"
      release_prohibited: "boolean"
      staging_phase: "judge_only"
  evaluator_fixtures:
    fixture_set_ref: "judge-plane URI + digest"
  task_accounts:
    - account_binding_id: "opaque per-instance/run binding"
      role_and_scope: "permitted task actions"
      reset_contract_ref: "reset/version ID"
      agent_visibility: "credential_value_visible | brokered_session_only"

credential_bindings:
  forbidden_fields: ["password", "private_key", "api_key_value", "access_token", "refresh_token", "license_token"]
  bindings:
    - binding_id: "opaque secret-manager reference"
      credential_class: "agent_provider | cloud_control | license | task_account | evaluator_only"
      principal: "workload/run identity"
      audience: "target service"
      scope: ["least-privilege actions/resources"]
      issuer: "identity/secret broker"
      injection_method: "host_proxy | workload_identity | sidecar | license_broker | judge_only"
      visible_to_agent: "boolean"
      issued_at_and_expires_at: "run-attestation fields"
      rotation_and_revocation_policy_ref: "policy ID"
      audit_log_ref: "secret-access audit stream"

lifecycle:
  preflight:
    script_or_workflow_ref: "revision + digest"
    required_checks: ["image", "start_state", "software", "license", "input", "network", "credential", "harness", "evaluator availability"]
  start:
    entrypoint_ref: "revision + digest"
    deterministic_seed_bindings: ["seed name/value or secret binding as applicable"]
    readiness_probe_ref: "revision + digest"
  reset:
    strategy: "new_instance | snapshot_restore | image_recreate | task_service_reset"
    workflow_ref: "revision + digest"
    verification_ref: "start-state test suite"
  cleanup:
    workflow_ref: "revision + digest"
    revoke_bindings: ["credential/task-account/license leases"]
    storage_sanitization_policy_ref: "policy/evidence ID"
    orphan_reaper_policy_ref: "policy ID"
    cleanup_attestation_required: "boolean"
  retry:
    policy_revision: "immutable adjudication policy"
    retryable_failure_classes: ["predeclared infrastructure classes only"]
    fresh_start_required: "boolean"
    attempt_selection_rule: "predeclared; never silently choose best/last success"
    preserve_all_attempts: "boolean"
    effect_boundary_definition_ref: "policy defining agent-visible and irreversible effects"
  failure_adjudication:
    cause_taxonomy_revision: "immutable two-axis taxonomy version"
    measurement_disposition_policy_ref: "score/regrade/retry/quarantine policy"
    independent_telemetry_required_for_infra_exclusion: "boolean"

agent_and_harness:
  agent_name: "agent system"
  agent_release_or_commit: "immutable version"
  foundation_model: "provider/model/revision if available"
  harness_commit_or_package_digest: "immutable ID"
  system_prompt_hash: "digest"
  tool_manifest_ref: "tools/permissions/versions URI + digest"
  executor_type_and_version: "in_guest | host_remote | container and version"
  context_memory_and_subagent_policy_ref: "policy revision"
  budgets:
    wall_clock_seconds: "client/pilot-approved value"
    model_or_token_budget: "client/pilot-approved value or null"
    action_or_turn_budget: "client/pilot-approved value or null"
  termination_policy_ref: "revision + digest"

evaluator:
  evaluator_id: "stable evaluator identity"
  code_commit_or_artifact_digest: "immutable ID"
  judge_substrate: "separate_container | separate_vm | host_simple_check | remote_service | exception_same_guest"
  judge_image_digest: "immutable image ID"
  reference_binding_ids: ["opaque bindings"]
  dependency_lock_and_sbom_refs: ["URI + digest"]
  model_judge:
    used: "boolean"
    provider_model_revision: "exact identity or null"
    prompt_hash: "digest or null"
    sampling_parameters: "fully specified or null"
    evaluator_secret_binding_id: "judge-only opaque ID"
  output_parser_hardening_ref: "sandbox/fuzz/resource-limit policy"
  score_schema_ref: "schema revision + digest"
  fixture_results_ref: "positive/negative/gaming fixture evidence"

observability_and_retention:
  run_events_schema_version: "version"
  trajectory_schema_version: "version"
  required_artifacts:
    - "resolved run manifest"
    - "event timeline"
    - "agent trajectory and raw harness logs"
    - "network decision log"
    - "resource/health telemetry"
    - "stdout/stderr and screenshots as policy permits"
    - "partial output bundle"
    - "evaluator inputs manifest and signed score"
    - "cleanup/revocation attestation"
  append_only_store_ref: "WORM/object-lock or equivalent evidence store"
  redaction_policy_ref: "structured secret/privacy redaction revision"
  encryption_policy_ref: "at-rest/in-transit policy"
  retention_class: "policy-driven class; duration supplied by client/legal/security"
  legal_hold_and_deletion_ref: "policy ID"

supply_chain:
  source_revisions: ["IaC, build recipe, task, harness, evaluator revisions"]
  builder_identity: "isolated build service identity"
  build_parameters_hash: "digest"
  provenance_level_claim: "declared SLSA or internal assurance level with evidence"
  vulnerability_scan_refs: ["scanner DB revision + report digest"]
  malware_scan_refs: ["engine/signature revision + report digest"]
  license_scan_ref: "report digest"
  policy_exceptions: ["approved waiver ID, owner, expiry, scope"]
  verification_result: "accepted | rejected | quarantined"

acceptance:
  test_suite_revision: "immutable ID"
  build_acceptance_report_ref: "report digest"
  start_state_report_ref: "report digest"
  software_launch_report_ref: "report digest"
  network_control_report_ref: "report digest"
  secret_leakage_report_ref: "report digest"
  reference_isolation_report_ref: "report digest"
  evaluator_repeatability_report_ref: "report digest"
  cleanup_and_recovery_report_ref: "report digest"
  accepted_at: "timestamp or null"
  accepted_by: "independent approver identity or null"
  pilot_threshold_profile_ref: "client-approved, pre-frozen threshold profile; no default value in schema"

run_attestation:
  declared_manifest_digest: "immutable digest of the release contract"
  resolved_at_utc: "timestamp"
  resolved_resources:
    image_id_and_digest: "actual provider image ID/content digest"
    instance_and_host_class: "actual instance, CPU, GPU, region/zone and host class"
    os_kernel_driver_versions: ["actual observed versions"]
    display_locale_clock_facts: ["actual observed values"]
    software_plugin_license_state: ["actual observed identities and readiness; no secret values"]
    network_policy_revision_and_probe_results: "actual policy and acceptance evidence"
  declared_observed_diff_ref: "structured diff with approved equivalence-class decisions"
  attempt:
    attempt_id: "globally unique attempt identity"
    parent_attempt_id: "prior attempt or null"
    retry_reason_and_eligibility_evidence: "null or adjudicated recovery record"
    first_agent_observation_at: "timestamp or null"
    first_external_effect_at: "timestamp or null"
  integrity:
    visible_input_hashes: ["actual staged hashes"]
    frozen_output_bundle_hash: "digest or null"
    required_artifact_manifest_hash: "digest"
    judge_input_manifest_hash: "digest or null"
    signed_score_ref: "digest/signature reference or null"
    cleanup_revocation_attestation_ref: "digest/signature reference"
  signature:
    signer_identity: "control-plane attestor"
    algorithm: "approved signature algorithm"
    signed_at_utc: "timestamp"
