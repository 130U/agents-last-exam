# C. ALE-style task minimum complete schema
# Status: project recommendation derived from pinned ALE paper/docs; not an official ALE JSON schema.
# A natural-language card/submission is candidate_spec only. Count as accepted_instance
# only after implementation, environment, evaluator, hidden-reference and QA gates pass.

schema_version: "ale-style-blueprint/0.1"

benchmark_snapshot:
  benchmark_id: "string"
  release_id: "string"
  manifest_sha256: "hex"
  source_repo_commit: "full-sha"
  paper_version: "arxiv-id-and-version"
  dataset_revision: "full-sha-or-null"
  access_date: "YYYY-MM-DD"

identity_and_units:
  submission_id: "string-or-null"       # upstream source unit
  commissioned_source_id: "string-or-null"
  workflow_id: "stable-string"          # shared professional procedure / evaluator family
  instance_id: "stable-string"          # concrete runnable variant
  variant_index: 0
  asset_status: "candidate_spec|implemented|pending_qc|accepted|retired"
  release_status: "development|validation|public|private_holdout|rotation_pool|retired"

taxonomy:
  taxonomy_version: "string"
  domain_id: "string"
  subdomain_id: "string"
  capability_tags: []
  sampling_frame_and_weight: null         # null unless client supplies a defensible frame

expert_and_provenance:
  workflow_origin: "prior_real_project|commissioned|other"
  expert_role_evidence: "reference-to-private-audit-record"
  source_and_use_rights: "reference-to-license/consent"
  pii_security_review: "pass|fail|not_applicable"
  exposure_ledger_ref: "private-record-id"
  near_duplicate_scan_ref: "report-id"

task_specification:
  task_card_path: "tasks/<domain>/<task>/task_card.json"
  main_py_path: "tasks/<domain>/<task>/main.py"
  task_card_sha256: "hex"
  main_py_sha256: "hex"
  visible_description: "string"
  expected_output_contract:
    - path_or_state: "string"
      format: "string"
      required: true
  selection_evidence:
    representative: "evidence-ref"
    complex_end_to_end: "evidence-ref"
    verifiable: "evidence-ref"

data_contract:
  visible_inputs:
    - path: "input/..."
      sha256: "hex"
      read_only: true
      provenance_ref: "record-id"
  hidden_references:
    - evaluator_only_path: "reference/..."
      sha256_private: "hex"
  output_root: "output/"
  reference_staging_policy: "after_agent_exit|encrypted_at_rest_then_eval_only"

environment_contract:
  provider_profile: "gcloud|aws|aliyun|docker|qemu|static|custom"
  vm_snapshot: "cpu-free-ubuntu|cpu-free|gpu-free|cpu-license|gpu-license|custom"
  image_digest: "immutable-digest"
  os_and_locale: {os: "string", locale: "string", timezone: "string"}
  resources: {vcpus: null, memory_gb: null, disk_gb: null, gpu: null}
  software:
    - {name: "string", version: "string", license_ref: "record-id-or-null"}
  network_policy: "offline|allowlist|open-with-audit"
  initial_state_recipe_sha256: "hex"
  timeout_s: null                         # pilot-derived; no invented default

lifecycle_contract:
  load:
    returns_one_entry_per_variant: true
    metadata_schema_version: "string"
  start:
    idempotent: true
    stages_only_visible_input: true
    reference_hidden_assertion: "test-id"
    app_start_state_assertions: []
  evaluate:
    evaluator_version: "string"
    evaluator_sha256: "hex"
    evaluator_family: "exact|structured|geometry|visual|behavioral|semantic|executable|hybrid"
    score_range: [0.0, 1.0]
    missing_output_score: 0.0
    gates: []
    tolerances_or_rubric: {}
    judge_config_hash: null               # required for LLM/VLM judge

qa_and_acceptance:
  expert_reference_review: "pass|fail"
  independent_spec_execution: "pass|fail"
  clean_environment_rebuild: "pass|fail"
  engineer_dry_run_ids: []
  golden_output_pass_test: "pass|fail"
  known_bad_output_fail_tests: []
  alternative_correct_output_tests: []
  mutation_metamorphic_tests: []
  reference_leakage_and_side_channel_tests: []
  evaluator_blind_audit_ref: "report-id"
  evaluator_fpr: null                     # estimate in pilot, do not invent threshold
  evaluator_fnr: null
  reproducibility_run_ids: []
  final_qc_decision: "accept|revise|reject"
  qc_audit_record: "private-record-id"

# Run configuration is recorded with results, but is not part of the task-asset count.
run_contract:
  agent_config_id: "string"
  foundation_model_snapshot: "string"
  harness_and_version: "string"
  effort: "string-or-null"
  system_prompt_hash: "hex"
  tools_permissions_hash: "hex"
  context_policy_hash: "hex"
  gui_cli_bridge_version: "string"
  wall_clock_cap_s: null
  token_api_cost_budget: {}
  retry_policy: "none|infrastructure_only|failed_unit_retry|best_of_k|custom"
  trial_index: 1
  run_id: "string"
  termination_reason: "completed|timeout|agent_error|infrastructure_error"
  artifact_and_trajectory_ref: "record-id"
  evaluator_result: null
